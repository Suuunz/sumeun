spring:
  config:
    import: "optional:file:./config/application-secret.yaml"
  application:
    name: hidden-travel
  thymeleaf:
    cache: false
  devtools:
    livereload:
      enabled: true

  # ----- DataSource (개발: H2 파일 모드) -----
  # 재시작해도 데이터 유지. MySQL/PostgreSQL 전환 시 이 블록만 교체.
  datasource:
    url: jdbc:h2:file:./data/sumeun
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ----- JPA / Hibernate -----
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ----- H2 콘솔 (개발 중 데이터 확인용: /h2-console) -----
  h2:
    console:
      enabled: true

server:
  port: 8080

# tour.api.key 는 커밋하지 않는다(공개 저장소 노출 방지).
# 주입 방법(둘 중 하나):
#   1) 환경변수 TOUR_API_KEY=... (relaxed binding → tour.api.key)
#   2) ./config/application-secret.yaml (gitignore됨) — 아래 spring.config.import 로 로드