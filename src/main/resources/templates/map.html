<!DOCTYPE html>
<html class="light" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sumeun · 지역 탐색')}"></head>
<body class="bg-background text-text-primary min-h-screen flex flex-col font-body-main antialiased selection:bg-accent-soft selection:text-primary">

<!-- 공통 상단 네비게이션 (지침 6: Stitch 네비 삭제 후 프래그먼트로 교체) -->
<header th:replace="~{fragments/layout :: header}"></header>

<!-- Main Content Canvas (Map Area) -->
<main class="flex-1 relative bg-background">
    <!-- 지도 영역 자리표시자 (이후 GeoJSON SVG 지도로 교체 · id 유지) -->
    <div id="map-placeholder"
         class="absolute inset-0 m-4 md:m-section-gap bg-surface-alt border border-border rounded-xl overflow-hidden">
        <!-- 시군구 SVG 지도 (map.js가 sig.json을 fetch해 path 채움) -->
        <svg id="korea-map" class="korea-map" viewBox="0 0 800 1000"
             preserveAspectRatio="xMidYMid meet" role="img" aria-label="대한민국 시군구 지도"></svg>

        <!-- 지도 위에 겹치는 UI (지침: 살린다) -->
        <!-- 안내 텍스트: 좌상단 -->
        <div class="absolute top-card-padding left-card-padding bg-surface/90 backdrop-blur-sm border border-border rounded-lg px-4 py-2 flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-sm">touch_app</span>
            <span class="font-caption text-caption text-text-primary">지역을 눌러보세요</span>
        </div>

        <!-- 지역 빠른 이동 칩 (검색 드롭다운 대체 · regionNames 바인딩 → /region/panel) -->
        <div class="absolute top-card-padding right-card-padding bg-surface/90 backdrop-blur-sm border border-border rounded-lg p-3 flex flex-col gap-2 w-48">
            <span class="font-caption text-caption text-text-muted px-1">이런 곳은 어때요?</span>
            <a th:each="name : ${regionNames}" th:href="@{/region/panel}"
               class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-accent-soft transition-colors font-body-main text-body-main text-text-primary">
                <span class="material-symbols-outlined text-text-muted text-sm">location_on</span>
                <span th:text="${name}">지역명</span>
            </a>
        </div>

        <!-- 무작위로 한 곳 보기: 우하단 → /region/panel -->
        <a th:href="@{/region/panel}"
           class="absolute bottom-card-padding right-card-padding bg-surface border border-border rounded-lg px-6 h-[44px] flex items-center gap-2 hover:bg-surface-alt transition-colors font-body-main text-body-main text-text-primary shadow-sm">
            <span class="material-symbols-outlined text-primary">shuffle</span>
            무작위로 한 곳 보기
        </a>
    </div>
</main>

<!-- 공통 푸터 -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- 지도 라이브러리(필요 모듈만 자체 호스팅) + 초기화 -->
<script th:src="@{/js/d3-array.min.js}"></script>
<script th:src="@{/js/d3-geo.min.js}"></script>
<script th:src="@{/js/topojson-client.min.js}"></script>
<script th:src="@{/js/map.js}"></script>
</body>
</html>
