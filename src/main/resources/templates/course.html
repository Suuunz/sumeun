<!DOCTYPE html>
<html class="light" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sumeun · 내 코스 만들기')}"></head>
<body class="bg-background text-text-primary font-body-main antialiased min-h-screen flex flex-col relative pb-8">

<!-- 코스 편집기 상단 바 -->
<header class="bg-surface w-full top-0 sticky z-50 border-b border-border h-20">
    <div class="max-w-container-max mx-auto px-8 flex justify-between items-center h-full gap-4">
        <a th:href="@{/region(sigCd=${data.sigCd})}" class="flex items-center gap-2 text-text-primary hover:text-accent-hover transition-colors font-semibold shrink-0">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span>지역으로 돌아가기</span>
        </a>
        <div class="relative group flex items-center justify-center flex-1">
            <input id="course-name-input" aria-label="코스 이름" type="text" th:value="${data.courseName}"
                   class="bg-transparent border-0 border-b-2 border-border focus:border-primary-container focus:ring-0 text-center font-display-title text-display-title text-primary tracking-tight w-72 pb-1 transition-colors px-0 cursor-text"/>
        </div>
        <!-- 로그인 상태: 저장 / 비로그인: 로그인으로 유도 (담은 코스는 sessionStorage 에 보존) -->
        <button th:if="${currentUser != null}" id="save-btn" type="button" disabled
                title="코스에 장소를 담아야 저장할 수 있어요"
                class="bg-primary-container hover:bg-accent-hover text-on-secondary h-[44px] px-6 rounded font-semibold transition-all duration-300 hover:-translate-y-[2px] whitespace-nowrap shrink-0 flex items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:bg-primary-container">
            <span class="material-symbols-outlined text-[18px]">save</span> 코스 저장
        </button>
        <a th:if="${currentUser == null}" id="login-to-save" th:href="@{/}"
           title="담아둔 코스는 로그인 후에도 그대로 남아 있어요"
           class="bg-primary-container hover:bg-accent-hover text-on-secondary h-[44px] px-6 rounded font-semibold transition-all duration-300 hover:-translate-y-[2px] whitespace-nowrap shrink-0 flex items-center gap-1">
            <span class="material-symbols-outlined text-[18px]">login</span> 로그인하고 저장
        </a>
    </div>
</header>

<main class="max-w-container-max mx-auto px-8 py-section-gap w-full flex-1 flex flex-col lg:flex-row gap-8 min-h-[calc(100vh-80px)]">

    <!-- ===== 왼쪽: 후보 목록 (지역 실데이터) ===== -->
    <aside class="w-full lg:w-[42%] flex flex-col gap-4 lg:h-[calc(100vh-144px)] lg:sticky lg:top-[112px]" id="candidate-side">
        <!-- 탭 -->
        <div class="flex items-center gap-1 border-b border-border w-full">
            <button class="tab-btn text-primary font-semibold border-b-2 border-primary pb-2 px-3 transition-colors" data-tab="attraction">관광지</button>
            <button class="tab-btn text-text-muted hover:text-text-primary pb-2 px-3 transition-colors" data-tab="food">먹거리</button>
            <button class="tab-btn text-text-muted hover:text-text-primary pb-2 px-3 transition-colors" data-tab="goodprice">착한 식당</button>
            <button class="tab-btn text-text-muted hover:text-text-primary pb-2 px-3 transition-colors" data-tab="specialty">특산물</button>
        </div>
        <p class="font-caption text-caption text-text-muted flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[16px]">info</span>
            추천 코스에 담긴 곳은 오른쪽에 이미 들어가 있어요
        </p>

        <div class="flex-1 overflow-y-auto no-scrollbar">
            <!-- 관광지 -->
            <div class="tab-panel flex flex-col gap-3 pb-8" data-panel="attraction">
                <p th:if="${data.attractions.isEmpty()}" class="font-caption text-caption text-text-muted py-6 text-center">이 지역의 관광지 데이터가 아직 없어요.</p>
                <th:block th:each="c : ${data.attractions}"><div th:replace="~{fragments/cards :: candCard(${c})}"></div></th:block>
            </div>
            <!-- 먹거리 -->
            <div class="tab-panel hidden flex-col gap-3 pb-8" data-panel="food">
                <p th:if="${data.foods.isEmpty()}" class="font-caption text-caption text-text-muted py-6 text-center">이 지역의 먹거리 데이터가 아직 없어요.</p>
                <th:block th:each="c : ${data.foods}"><div th:replace="~{fragments/cards :: candCard(${c})}"></div></th:block>
            </div>
            <!-- 착한 식당 -->
            <div class="tab-panel hidden flex-col gap-3 pb-8" data-panel="goodprice">
                <p th:if="${data.goodShops.isEmpty()}" class="font-caption text-caption text-text-muted py-6 text-center">이 지역의 착한가격업소 데이터가 아직 없어요.</p>
                <th:block th:each="c : ${data.goodShops}"><div th:replace="~{fragments/cards :: candCard(${c})}"></div></th:block>
            </div>
            <!-- 특산물 -->
            <div class="tab-panel hidden flex-col gap-3 pb-8" data-panel="specialty">
                <p th:if="${data.specialties.isEmpty()}" class="font-caption text-caption text-text-muted py-6 text-center">이 지역의 특산물 데이터가 아직 없어요.</p>
                <th:block th:each="c : ${data.specialties}"><div th:replace="~{fragments/cards :: candCard(${c})}"></div></th:block>
            </div>
        </div>
    </aside>

    <!-- ===== 오른쪽: 내 코스 ===== -->
    <section class="w-full lg:w-[58%] flex flex-col">
        <div class="bg-surface border border-border rounded-lg p-card-padding flex flex-col h-full min-h-[600px]">
            <div class="flex items-center justify-between border-b border-border pb-4 mb-6">
                <h2 class="font-section-title text-section-title text-text-primary">나의 코스</h2>
                <div class="flex flex-col items-end">
                    <span class="font-caption text-caption text-text-muted">총 장소</span>
                    <span class="font-semibold text-text-primary"><span id="total-places">0</span>곳</span>
                </div>
            </div>

            <div id="course-timeline" class="flex-1 flex flex-col">
                <!-- 초기 코스 항목(추천 코스에서 담아옴) -->
                <div th:each="it : ${data.initialItems}"
                     class="course-item flex items-center gap-3 bg-surface border border-border rounded-lg p-3 mb-3"
                     th:attr="data-name=${it.name},data-type='course',data-category=${it.type},data-sage=${it.sage}">
                    <span class="material-symbols-outlined text-text-muted cursor-grab drag-handle text-[20px]">drag_indicator</span>
                    <div class="w-7 h-7 rounded-full bg-accent-soft text-primary flex items-center justify-center font-bold text-sm shrink-0 order-num" th:text="${it.order}">1</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-semibold text-text-primary truncate" th:text="${it.name}">이름</span>
                            <span class="bg-surface-alt text-text-muted font-caption text-caption px-2 py-0.5 rounded text-[11px]" th:text="${it.type}">유형</span>
                            <span th:if="${it.sage}" class="badge-sage">착한가격업소</span>
                        </div>
                    </div>
                    <button type="button" class="del-btn text-text-muted hover:text-error transition-colors p-1" aria-label="삭제">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <!-- 빈 상태 -->
                <div id="empty-state" class="mt-4 border-2 border-dashed border-outline-variant rounded-lg p-6 flex flex-col items-center justify-center text-center opacity-60">
                    <span class="material-symbols-outlined text-text-muted text-[32px] mb-2">add_location_alt</span>
                    <p class="font-caption text-caption text-text-muted">왼쪽에서 가고 싶은 곳을 담아<br/>나만의 코스를 만들어보세요</p>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- 저장 폼(숨김) — course.js가 채워 제출 -->
<form id="save-form" th:action="@{/course/save}" method="post" class="hidden">
    <input type="hidden" name="sigCd" th:value="${data.sigCd}"/>
    <input type="hidden" name="courseName" id="f-courseName"/>
    <!-- 경유지 전체를 JSON 으로 보낸다: [{name,type,sage}, ...] (장소 수·착한가격업소 수는 서버가 집계) -->
    <input type="hidden" name="itemsJson" id="f-itemsJson"/>
</form>

<script th:src="@{/js/course.js}"></script>
</body>
</html>
